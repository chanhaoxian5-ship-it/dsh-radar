<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">DSH Radar</title>
  <desc id="desc">A notification radar with a document signal and a sweeping beam.</desc>
  <defs>
    <linearGradient id="shell" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#26375a"/>
      <stop offset="1" stop-color="#141e34"/>
    </linearGradient>
    <linearGradient id="beam" x1="118" y1="382" x2="386" y2="102" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5de1ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#a98bff" stop-opacity=".78"/>
    </linearGradient>
    <linearGradient id="signal" x1="126" y1="122" x2="382" y2="386" gradientUnits="userSpaceOnUse">
      <stop stop-color="#66e5ff"/>
      <stop offset="1" stop-color="#907dff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#shell)"/>
  <circle cx="256" cy="256" r="164" fill="none" stroke="#7c8dbd" stroke-opacity=".28" stroke-width="8"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="#7c8dbd" stroke-opacity=".34" stroke-width="7"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#7c8dbd" stroke-opacity=".42" stroke-width="6"/>
  <path d="M256 256 382 130A176 176 0 0 0 381 381Z" fill="url(#beam)" opacity=".6"/>
  <path d="M256 256 382 130" stroke="#b5a5ff" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="16" fill="#f4f8ff" filter="url(#glow)"/>
  <path d="M137 150h75l31 31v91a18 18 0 0 1-18 18h-88a18 18 0 0 1-18-18v-104a18 18 0 0 1 18-18Z" fill="#f4f8ff" fill-opacity=".96"/>
  <path d="M212 150v31h31" fill="none" stroke="#b7c5e8" stroke-width="7" stroke-linejoin="round"/>
  <path d="M151 219h62M151 245h45" stroke="#6879b3" stroke-width="11" stroke-linecap="round"/>
  <circle cx="155" cy="282" r="11" fill="url(#signal)"/>
  <path d="M370 331c-12 20-32 36-55 45M398 349c-16 26-42 47-72 58" fill="none" stroke="#66e5ff" stroke-linecap="round" stroke-width="10" opacity=".88"/>
</svg>
